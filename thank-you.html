<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Received | MSQM Store</title>
<meta name="description" content="Your MSQM Premium 4-in-1 Grooming Set order is almost complete. Confirm on WhatsApp to get it delivered within 24 hours.">
<link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
<link rel="apple-touch-icon" href="assets/favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#FFFFFF; --surface:#F6F3EE; --alt:#EAF4F4;
    --primary:#D62839; --secondary:#F4A300; --ink:#181818; --ink-soft:#4A4A4A;
    --font-head:'Barlow Condensed', sans-serif; --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    font-family:var(--font-body); color:var(--ink);
    background:linear-gradient(160deg, var(--base), var(--alt));
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    max-width:520px; width:100%;
    background:#fff; border-radius:20px; padding:0 0 40px;
    border:1px solid rgba(0,0,0,0.08);
    text-align:center;
    overflow:hidden;
  }
  .product-photo{
    width:100%; aspect-ratio:4/3;
    background:linear-gradient(155deg, var(--surface), var(--alt));
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .product-photo img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .product-photo svg{ width:38%; opacity:0.85; }
  .product-photo .ph-note{
    position:absolute; bottom:12px; left:12px; right:12px;
    background:rgba(24,24,24,0.8); color:#fff;
    font-size:12px; padding:8px 10px; border-radius:8px;
  }
  .card-body{ padding:32px 32px 0; }
  h1{ font-family:var(--font-head); font-weight:700; font-size:clamp(1.8rem,5vw,2.3rem); margin:0 0 14px; }
  p{ color:var(--ink-soft); font-size:16px; line-height:1.6; margin:0 0 10px; }
  .btns{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:26px; }
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:16px 30px; border-radius:999px; font-weight:700; font-size:16px;
    text-decoration:none;
  }
  .btn-primary{ background:var(--primary); color:#fff; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="product-photo">
      <img src="assets/product-thankyou.jpg" alt="MSQM Premium 4-in-1 Grooming Set" loading="eager" width="900" height="675"
        onerror="this.style.display='none'; this.parentElement.querySelector('.ph-fallback').style.display='flex';">
      <div class="ph-fallback" style="display:none; position:absolute; inset:0; align-items:center; justify-content:center; flex-direction:column;">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="70" y="20" width="30" height="140" rx="10" fill="#D62839"/>
          <rect x="76" y="30" width="18" height="70" rx="4" fill="#181818"/>
          <rect x="60" y="150" width="60" height="16" rx="6" fill="#F4A300"/>
        </svg>
        <div class="ph-note">Real product photo goes here, save it as assets/product-thankyou.jpg</div>
      </div>
    </div>

    <div class="card-body">
      <h1 id="heading">Your order is on the way</h1>
      <p id="introText">Click the button below to confirm your order, and we'll deliver your MSQM Premium 4-in-1 Grooming Set to you within 24 hours.</p>

      <div class="btns">
        <a class="btn btn-primary" id="confirmBtn" href="https://wa.me/2349134601088" target="_blank" rel="noopener">Confirm Your Order</a>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const firstName = params.get('firstName');
    const lastName = params.get('lastName');
    const phone = params.get('phone');
    const waDial = params.get('waDial');
    const waNumber = params.get('waNumber');
    const address = params.get('address');
    const city = params.get('city');
    const state = params.get('state');

    if(firstName && lastName && phone && waDial && waNumber && address && city && state){
      const message = "Hello MSQM Store, I want to confirm my order for the MSQM Premium 4-in-1 Grooming Set (N120,000, payment on delivery).%0A%0A"
        + "Name: " + firstName + " " + lastName + "%0A"
        + "Phone: " + phone + "%0A"
        + "WhatsApp: +" + waDial + " " + waNumber + "%0A"
        + "Address: " + address + ", " + city + ", " + state + " State";

      document.getElementById('confirmBtn').href = "https://wa.me/2349134601088?text=" + message;
    } else {
      document.getElementById('introText').textContent = "Click the button below to confirm your order, and we'll deliver your MSQM Premium 4-in-1 Grooming Set to you within 24 hours.";
    }
  </script>
</body>
</html>
